<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner de Asistencia</title>
    <!-- Librería oficial corregida -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
        #reader { width: 100%; max-width: 400px; margin: auto; background: white; border-radius: 10px; padding: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #resultado { margin-top: 20px; font-size: 20px; font-weight: bold; padding: 15px; border-radius: 8px; display: inline-block; }
        .success { background: #d4edda; color: #155724; }
        .warning { background: #fff3cd; color: #856404; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 10px 20px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>Control de Acceso - Evento</h2>
    <p>Presiona el botón para activar la cámara</p>
    
    <button onclick="iniciarCamara()">Iniciar Escáner</button>
    <br><br>
    <div id="reader"></div>
    <div id="resultado">Esperando escaneo...</div>

    <script>
        // PEGA AQUÍ LA URL DE TU WEB APP DE APPS SCRIPT
        const URL_BACKEND = "https://script.google.com/macros/s/AKfycbzaiqn8ilkQn77w8_Y3A5QdB4cd5Dj0prnQCTPGbQbSqbCDVRqCfmUvc2tpwl7I3hiV/exec";

        let html5QrCode;

        function iniciarCamara() {
            html5QrCode = new Html5Qrcode("reader");
            
            html5QrCode.start(
                { facingMode: "environment" }, // Usa la cámara trasera
                { fps: 10, qrbox: 250 },
                onScanSuccess
            ).catch(err => {
                alert("Error al iniciar la cámara. Asegúrate de dar permisos o usar un enlace HTTPS (GitHub Pages). Detalle: " + err);
            });
        }

        // Función auxiliar para realizar el fetch con reintentos automáticos
        async function enviarConReintentos(datosQR, intentosMaximos = 3) {
            for (let intento = 1; intento <= intentosMaximos; intento++) {
                try {
                    let response = await fetch(URL_BACKEND, {
                        method: "POST",
                        body: JSON.stringify(datosQR),
                        headers: { "Content-Type": "text/plain;charset=utf-8" }
                    });
                    
                    let data = await response.json();

                    // Si el servidor responde con éxito, advertencia (ej. ya ingresó) o error de negocio conocido, lo devolvemos
                    if (data.status === "success" || data.status === "warning" || intento === intentosMaximos) {
                        return data;
                    }

                    // Si hubo un fallo de saturación, esperamos 1 segundo antes de reintentar
                    console.warn(`Intento ${intento} fallido. Reintentando...`);
                    await new Promise(resolve => setTimeout(resolve, 1000));

                } catch (err) {
                    if (intento === intentosMaximos) {
                        return { status: "error", message: "❌ Error de conexión con el servidor" };
                    }
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }
            }
        }

        async function onScanSuccess(decodedText, decodedResult) {
            html5QrCode.pause();
            
            let resDiv = document.getElementById("resultado");
            resDiv.className = "";
            resDiv.innerText = "Procesando...";

            // Llamamos a nuestra función de reintentos
            let data = await enviarConReintentos({ email: decodedText });

            resDiv.innerText = data.message;
            if (data.status === "success") resDiv.className = "success";
            else if (data.status === "warning") resDiv.className = "warning";
            else resDiv.className = "error";

            setTimeout(() => {
                resDiv.innerText = "Esperando siguiente QR...";
                resDiv.className = "";
                html5QrCode.resume();
            }, 3000);
        }
    </script>
</body>
</html>
